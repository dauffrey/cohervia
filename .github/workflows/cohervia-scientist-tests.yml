name: Cohervia Scientist tests

on:
  pull_request:
    paths:
      - "scientist/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/cohervia-scientist-tests.yml"
  push:
    branches:
      - "scientist/**"
      - "main"
    paths:
      - "scientist/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/cohervia-scientist-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: scientist
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and optional OpenAI adapter dependency
        run: python -m pip install -e ".[openai]"
      - name: Test (scripted and mocked providers; no API credentials)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: cohervia-scientist status
      - name: Approved repository context smoke test
        run: python -c "from pathlib import Path; from cohervia_scientist.context import RepositoryContext; s = RepositoryContext(Path('..').resolve(), Path('.').resolve()).snapshot(); assert len(s.sources) == 11; assert all(not x['truncated'] for x in s.sources)"
      - name: Whitespace check
        run: git diff --check
      - name: Scripted qualification and archive verification
        run: |
          cohervia-scientist qualify
          python -c "from pathlib import Path; from cohervia_scientist.qualification import verify_archive; root=Path('.').resolve(); files=list((root/'runs').glob('qualification-*-summary.json')); assert len(files)==1; print(verify_archive(root,files[0].name))"
      - name: Preserve qualification instrumentation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-python-${{ matrix.python }}
          path: scientist/runs/qualification-*.json
          if-no-files-found: error
          retention-days: 90
