name: Cohervia Scientist tests

on:
  pull_request:
    paths:
      - "scientist/**"
      - ".github/workflows/cohervia-scientist-tests.yml"
  push:
    branches:
      - "scientist/**"
    paths:
      - "scientist/**"
      - ".github/workflows/cohervia-scientist-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: cohervia-scientist status
