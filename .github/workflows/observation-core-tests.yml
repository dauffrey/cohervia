name: Minimal observation and audit core
on:
  pull_request:
  push:
    branches: [main, 'core/**']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install separate observation package with pinned JCS
        run: python -m pip install -e ./core
      - name: Contract acceptance regressions (fabricated bytes only)
        run: python -m unittest discover -s core/tests -v
      - name: Preserved Scientist, evidence and authority boundaries
        run: python -m unittest discover -s tests -v
      - name: Whitespace integrity
        run: git diff --check
