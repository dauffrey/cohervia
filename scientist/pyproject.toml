[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohervia-scientist"
version = "0.2.1"
description = "Bounded autonomous scientific reasoning scaffold for Cohervia"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.0.0,<3"]

[project.scripts]
cohervia-scientist = "cohervia_scientist.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
