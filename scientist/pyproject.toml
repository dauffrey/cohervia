[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohervia-scientist"
version = "0.1.0"
description = "Foundation scaffold for the Cohervia autonomous scientific research system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cohervia-scientist = "cohervia_scientist.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
