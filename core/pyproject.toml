[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohervia-observation-core"
version = "0.1.0"
description = "Local observation validation and deterministic audit replay; no scientific qualification"
requires-python = ">=3.11"
dependencies = ["rfc8785==0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]
