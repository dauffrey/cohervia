experiment_id: COH-EXP-0001
status: proposed_not_executed
safety_tier: yellow
safety_tier_scope: entire_matrix

factors:
  agent_count:
    - 1
    - 2
  code_tool:
    - "off"
    - "on"
  verifier_feedback:
    - "off"
    - "on"
  structured_memory:
    - "off"
    - "on"

task_families:
  - algorithmic_verifiable
  - mathematical_verifiable

network:
  public_access: false

credentials:
  real_credentials_allowed: false

services:
  synthetic_only: true

external_side_effects:
  allowed: false

isolation:
  namespace_isolation_required: true
  explicit_channel_inventory_required: true
  instrumented_shared_state_required: true

audit:
  externally_protected_or_append_only: true

governance:
  acting_agent_controls_evaluator: false
  acting_agent_controls_monitor: false
  acting_agent_controls_stop_controller: false
  acting_agent_controls_permissions: false
  acting_agent_controls_audit_log: false
  acting_agent_controls_emergence_classification: false

holdout:
  inputs_blinded_during_development: true
  outcomes_blinded_during_development: true
  frozen_evaluator_only_after_freeze: true

emergence_classification:
  observer_independent: true
  delta_min_frozen_before_holdout: true
  confidence_procedure_frozen_before_holdout: true
  multiplicity_rule_frozen_before_holdout: true

freeze_required_before_confirmatory_execution:
  - model_identity
  - orchestrator_version
  - tool_versions
  - task_manifest
  - development_manifest
  - holdout_manifest
  - baseline_estimator
  - delta_min
  - uncertainty_procedure
  - multiplicity_rule
  - success_threshold
  - comparator_definition
  - observer_features
  - observer_thresholds
  - verifier_identity
  - configuration_hashes
  - channel_inventory
  - stop_conditions
